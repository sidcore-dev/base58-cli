[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "base58-cli"
version = "1.0.0"
description = "Encode and decode Base58 (Bitcoin alphabet), binary-safe, via big-integer math with no dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "sidcore-dev" }]
keywords = ["base58", "encoding", "cli", "devtools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Utilities",
]

[project.scripts]
base58-cli = "base58_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
